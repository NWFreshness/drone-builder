<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const s = fill(sp(hull(pts3.map(([x,y,z]) => P(x+(z-z0)*sx*k, y+(z-z0)*sy*k, z0)))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  // on a phone (LBL_U = drawing units per screen px) the pill is a numbered badge and the names go in a legend under the figure
  const u = window.LBL_U ? LBL_U() : 0, n = ((window.__ln || (window.__ln = {}))[text] || (__ln[text] = Object.keys(__ln).length + 1));
  const k = INK_K, [X,Y] = P(...p3), fs = u ? 10*u : 8.6*k, h = u ? 17*u : fs*1.8, w = u ? h*(n > 9 ? 1.3 : 1) : text.length*fs*.62 + fs*1.5, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}" data-n="${n}" data-t="${text}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`

    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.innerHTML = '';
      // every choice stays clickable, so nothing silently ignores a press:
      //   current:true  = the one in use (shown selected); a press just says so
      //   disabled:true = not possible right now (shown faded); a press says why (c.why, or a generic note)
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;
        if (c.current) ch.setAttribute('aria-pressed', 'true');
        ch.onclick = ev => { ev.stopPropagation(); closeChips();
          if (c.current) return ui.flash(`${c.label} — already set`);
          if (c.disabled) return ui.flash(c.why || `${c.label} isn't possible right now`);
          c.onClick(st, ui); ui.render(); }; chips.appendChild(ch); }
      wrap.classList.add('open'); };
  });
  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => w.classList.remove('open')); }
  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);
  }
  // labels: the switch appears when the figure draws any tag(); ?labels=0 starts with them hidden
  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------
   xrCallouts(items, B): pills in two columns either side of the object, sorted top to bottom so leaders never cross.
     items: [{ at:[x,y,z], text, on }], B: the object's bounds [x0, x1, y0, y1, z0, z1].
   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.
   xrMount(getUI, caption): the See-through / Labels switches (top right), the caption under the figure, label hiding. */
function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}
function xrGhost(body, mech, k, OUTp, x0, x1, m){
  const fF = facing([1,0,0]), fB = facing([-1,0,0]);
  const far = `<g opacity="${f(.5*k)}">` + loft(on(PX(x0), OUTp), on(PX(x1), OUTp), n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true)
    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...on(PX(x0), OUTp), ...on(PX(x1), OUTp)], 2.8) + `</g>`;
}
function xrMount(getUI, caption, opt = {}){   // opt.labelsOnly: only the Labels switch (the insides are on show already)
  const ui = getUI(), q = new URLSearchParams(location.search), html = document.documentElement;
  if (q.get('labels') !== '1') html.classList.add('nolabels');
  if (ui.st.xr == null){ ui.st.xr = 0; ui.st.xrT = 0; }
  if (q.get('xr') === '1') ui.st.xr = ui.st.xrT = 1;
  const old = document.getElementById('lblctl'); if (old) old.style.display = 'none';
  const vset = document.createElement('div'); vset.className = 'vset';
  vset.innerHTML = '<div class="vrow">' + (opt.labelsOnly ? '' : '<button class="act" id="xrb" aria-pressed="false">See-through</button>') + '<button class="act" id="lblb" aria-pressed="false">Labels</button></div>';
  document.querySelector('.stage').appendChild(vset);
  // pages with a stats panel in the top right: the switches go just under it
  const place = () => { const sp = document.getElementById('stats'); vset.style.top = sp ? (sp.offsetTop + sp.offsetHeight + 10) + 'px' : ''; };
  place(); new ResizeObserver(place).observe(document.getElementById('stats') || vset);
  const xrb = document.getElementById('xrb'), lblb = document.getElementById('lblb');
  const sync = () => { if (xrb) xrb.setAttribute('aria-pressed', !!getUI().st.xrT); lblb.setAttribute('aria-pressed', !html.classList.contains('nolabels')); };
  if (xrb) xrb.onclick = () => { const u = getUI(), st = u.st; st.xr = st.xr || 0; st.xrT = st.xrT ? 0 : 1; sync();
    u.animate(dt => { const g = Math.sign(st.xrT - st.xr); st.xr = Math.min(1, Math.max(0, st.xr + g*dt/.7)); return st.xr !== st.xrT; }); };
  lblb.onclick = () => { html.classList.toggle('nolabels'); sync(); };
  sync();
  const cap = document.createElement('p'); cap.className = 'mcap'; document.querySelector('.stage').after(cap);
  const css = document.createElement('style');
  css.textContent = '.vset{position:absolute;top:4px;right:0;z-index:2}.vrow{display:flex;gap:6px}.vset .act[aria-pressed=true]{background:var(--ink);color:var(--paper)}'
    + 'html.nolabels #fig .tag{display:none}.mcap{width:100%;max-width:760px;min-height:3em;margin:0 0 14px;font-size:12.5px;line-height:1.5;text-align:center;transition:opacity .3s}'
    + '@media (max-width:560px){.vset{position:static;margin:4px 0}}';
  document.head.appendChild(css);
  const r0 = ui.render; ui.render = () => { r0(); const st = getUI().st; cap.style.opacity = st.xr > .5 ? 1 : 0; cap.textContent = caption(st); };
  ui.render();
}
// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...A, ...B], 2.8) + `</g>`;
}
// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){
    let s = sceneFn.apply(this, arguments);
    const st = opts.getSt(), k = ease(st.xr || 0);
    if (k > 0 && opts.under) s = xrUnder(s, opts.mech(st, k), k);   // the whole drawing is the object
    else if (k > 0 && !opts.inline) s = `<g opacity="${f(1 - .5*k)}">${s}</g><g opacity="${f(k)}">${opts.mech(st, k)}</g>`;   // inline: the figure ghosts its own case
    const items = k > .6 ? opts.inside(st) : opts.surface ? opts.surface(st) : [];
    return s + (items.length ? xrCallouts(items, opts.B) : '');
  };
}

/* ---------- game keypad: mountKeypad({ rows, hub:[col,row], action:'DROP', keys:[{ key:'ArrowLeft', glyph:'\u25c0', name, at:[col,row] }] })
   An inked pad under the buttons that sends the same keyboard events as the arrows and space (set window.GAME_KEYS = true
   so the arrows play instead of turning the camera). ---------- */
function mountKeypad(spec){
  const host = document.getElementById('btns'); if (!host) return;
  const css = document.createElement('style');
  css.textContent = `.kpad{display:flex;align-items:center;gap:16px;margin-top:6px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:14px;
      background:var(--paper);box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
    .kpad .dp{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(var(--rows),34px);gap:3px}
    .kpad .k{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:34px;height:34px;cursor:pointer;
      background:#fbf7ea;border:1.5px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);color:var(--ink);font:700 13px ui-monospace,Menlo,monospace;
      transition:transform .05s,box-shadow .05s,background .05s}
    .kpad .hub{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
    .kpad .hub i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:#e6e0d1}
    .kpad .go{all:unset;box-sizing:border-box;width:62px;height:62px;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#e2483d;border:1.5px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18);color:#fff;font:800 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;
      transition:transform .05s,box-shadow .05s}
    .kpad .go small{font:700 8px ui-monospace,Menlo,monospace;opacity:.85;letter-spacing:.08em;margin-top:2px}
    .kpad .down{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
    .kpad .k.down{background:var(--accent,#f4b829)}
    .kpad .go.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.18)}
    @media (max-width:560px){.kpad{gap:22px;padding:10px 16px}.kpad .dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(var(--rows),44px)}
      .kpad .k,.kpad .hub{width:44px;height:44px;font-size:15px}.kpad .go{width:74px;height:74px}}`;
  document.head.appendChild(css);
  const pad = document.createElement('div'); pad.className = 'kpad'; pad.setAttribute('role', 'group'); pad.setAttribute('aria-label', 'Keypad');
  const dp = document.createElement('div'); dp.className = 'dp'; dp.style.setProperty('--rows', spec.rows);
  const els = {};
  for (const k of spec.keys){
    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.glyph; b.setAttribute('aria-label', k.name);
    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${spec.action}<small>SPACE</small>`; go.setAttribute('aria-label', spec.action);
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

</script>
<script>
/* Drone Lab shared data: the build steps, what every part does, and the drones themselves.
   Used by the hub (drone-lab.html), the assembly figure (drone-assembly.html) and the simulator (drone-flight.html).
   Geometry is in millimetres (x = nose direction, y = left, z = up); flight numbers are SI units. */

// Real build order. Props go on LAST on every real build (after the motors have been tested without them) and the
// battery is only plugged in to fly, so both come after the shell.
const DL_STEPS = [
  { k:'frame',   name:'Frame',            t:'The frame is the skeleton: carbon-fibre plates that everything bolts to. It has to be stiff, because any flex shows up as vibration in the gyro.' },
  { k:'boom',    name:'Tail boom',        t:'The boom puts the tail rotor a long way behind the main rotor. That long lever is the whole trick: a small sideways push out there swings the entire nose. It also carries the drive shaft aft.' },
  { k:'arms',    name:'Arms',             t:'The arms put the motors far enough apart that the props never touch. Longer arms carry bigger props; on most FPV frames a crashed arm unbolts and is swapped in minutes.' },
  { k:'motors',  name:'Motors',           t:'Brushless motors: a ring of magnets in the spinning bell, coils on the fixed stator. "2207" means a 22 mm wide, 7 mm tall stator. Diagonal motors spin the same way.' },
  { k:'esc',     name:'ESCs',             t:'Electronic speed controllers turn battery DC into three switched phases that spin each motor, thousands of times a second, at whatever speed the flight controller asks for.' },
  { k:'fc',      name:'Flight controller',t:'The brain: a gyro measures rotation thousands of times a second, and the PID loop corrects the motors to make the drone rotate exactly as fast as your sticks ask.' },
  { k:'camera',  name:'Camera & radios',  t:'The camera feeds the video transmitter (VTX) that sends live video to your goggles; the receiver (RX) picks up your radio sticks. Two separate radio links.' },
  { k:'wiring',  name:'Wiring',           t:'Three motor wires per motor to the ESC, a thick battery lead with a capacitor to soak up voltage spikes, and thin signal wires between the boards.' },
  { k:'shell',   name:'Top plate / shell',t:'The top plate or shell closes the frame, stiffens it and protects the electronics. It also carries the battery strap or slot.' },
  { k:'payload', name:'Payload pod',      t:'The pod slung under the belly on two rails. It carries the marker charge for the target range. Hanging it low puts the mass under the frame, which steadies the drone but makes it heavier to accelerate.' },
  { k:'battery', name:'Battery',          t:'A lithium battery: each cell is 4.2 V full and should not go below about 3.5 V under load. It goes on only to fly; weight sits near the centre so the drone balances.' },
  { k:'props',   name:'Propellers',       t:'Props go on last, always. Half spin clockwise and half counter-clockwise so their twisting forces cancel. Red arrow = clockwise from above, blue = counter-clockwise.' },
  { k:'rotor',   name:'Main rotor',       t:'The main rotor is the wing. Two long blades spun fast enough that each one meets air at flying speed: pitch sets how hard they bite (collective), and tilting the whole disc sends that thrust sideways (cyclic). The blades go on last, like props.' },
];

// what each kind of part does (shown when a part is clicked, and as its tooltip)
const DL_PARTS = {
  plate:    ['FRAME PLATE', 'Carbon-fibre plate. Carbon is light and very stiff; the stack and arms bolt to it.'],
  arm:      ['ARM', 'Holds a motor out from the centre. The distance between diagonal motors is the "wheelbase".'],
  duct:     ['DUCT', 'A ring around the prop. It protects people and things and adds a little thrust at low speed, at the cost of drag at high speed.'],
  standoff: ['STANDOFF', 'Aluminium posts that hold the top plate above the bottom plate and make a box around the electronics.'],
  foot:     ['FOOT', 'Rubber or legs the drone stands on, so the bottom plate and camera never hit the ground first.'],
  gear:     ['LANDING GEAR', 'Tall legs keep the big camera clear of the ground on take-off and landing.'],
  motor:    ['MOTOR', 'Brushless outrunner. Its speed (KV x volts) and the prop size set how much thrust it makes. It spins whichever way the ESC drives it.'],
  esc:      ['ESC', 'Electronic speed controller: switches battery power through the motor coils in sequence. Changing two motor wires (or a setting) reverses the motor.'],
  fc:       ['FLIGHT CONTROLLER', 'Reads the gyro about 8000 times a second and runs the PID loop: it works out how hard each motor must push to match the rotation your sticks ask for.'],
  gyro:     ['GYRO (IMU)', 'Measures rotation speed on three axes. In acro mode this is the only sensor the drone uses: it holds whatever angle you leave it at.'],
  rx:       ['RECEIVER', 'Picks up your radio transmitter. Throttle, yaw, pitch and roll arrive as numbers the flight controller turns into rotation rates.'],
  vtx:      ['VIDEO TX', 'Sends the camera picture to your goggles in real time (5.8 GHz). Never power it without an antenna fitted.'],
  antenna:  ['ANTENNA', 'Antennas stick out the back, away from the carbon frame, which blocks radio signals.'],
  camera:   ['FPV CAMERA', 'Wide-angle, very low-latency camera you fly through. It is tilted up because the drone leans forward to fly forward.'],
  action:   ['ACTION CAMERA', 'Records the smooth high-quality footage; the FPV camera is only for flying.'],
  gimbal:   ['GIMBAL', 'Three small motors hold the camera level whatever the drone does, so the footage stays smooth while the drone tilts.'],
  gps:      ['GPS', 'Lets the drone know where it is, so it can hold position, fly home and land by itself.'],
  shell:    ['SHELL', 'Moulded body: keeps rain and dust off the electronics and stiffens the frame.'],
  canopy:   ['CANOPY', 'Soft TPU cover over the electronics: bends in a crash instead of breaking.'],
  battery:  ['BATTERY', 'LiPo or Li-ion pack. Cells in series (S) raise the voltage; capacity (mAh) sets flight time. Voltage sags under hard throttle.'],
  strap:    ['BATTERY STRAP', 'Holds the battery. A loose battery shifts the balance mid-flight.'],
  xt60:     ['BATTERY LEAD', 'Thick silicone wires and an XT60/XT90 connector carry up to 150 A.'],
  cap:      ['CAPACITOR', 'Soaks up voltage spikes from the motors that could reset or damage the electronics.'],
  wire:     ['MOTOR WIRES', 'Three phase wires per motor. Any order works; swapping two reverses the motor.'],
  pdb:      ['POWER BOARD', 'Power distribution board: splits battery power to every ESC.'],
  prop:     ['PROPELLER', 'Twisted blades push air down. A CW prop and a CCW prop are mirror images: fit the wrong one and it pushes air up.'],

<script>
/* Drone Lab: draws any multirotor in DL_DRONES with the Colorfigures engine (core.js), part by part.
   Everything goes through ddXF(), so the whole drone can tilt and lift for the "how it flies" demo, and every part
   is a byDepth item with its own box, so it sorts correctly from every side.
   x = nose, y = left, z = up, millimetres; the drone's centre sits at DD_O. */

let DD_O = [0, 0, 0];                       // world position of the drone centre (z = the surface it stands on)
let DD_T = { r:0, p:0, y:0, zc:0, lift:0 };  // demo attitude: roll (+ right side down), pitch (+ nose down), yaw (+ left), about height zc
let DD_DZ = [0, 0, 0];                      // extra offset while a part is being placed (it drops in)
const DD_CW = '#e2483d', DD_CCW = '#3f78d8';
const DD_CARBON = { l:'#5a5651', m:'#3f3c38', d:'#2a2825' };
const DD_ALU = { l:'#f0d27a', m:'#d9b04a', d:'#9c7a26' };
const DD_PCB_E = matOf('#3f8f5a'), DD_PCB_F = matOf('#4b4f9e'), DD_CHIP = matOf('#2b2826');
const DD_COPPER = matOf('#e0a35a'), DD_RUBBER = matOf('#3a3632'), DD_SILVER = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const DD_GREY = matOf('#d9d6cc'), DD_WHITE = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };

function ddXF(p){
  let x = p[0], y = p[1], z = p[2] - DD_T.zc;
  const t = DD_T;
  if (t.r){ const c = Math.cos(t.r), s = Math.sin(t.r); [y, z] = [y*c - z*s, y*s + z*c]; }
  if (t.p){ const c = Math.cos(t.p), s = Math.sin(t.p); [x, z] = [x*c + z*s, -x*s + z*c]; }
  if (t.y){ const c = Math.cos(t.y), s = Math.sin(t.y); [x, y] = [x*c - y*s, x*s + y*c]; }
  return [x + DD_O[0] + DD_DZ[0], y + DD_O[1] + DD_DZ[1], z + DD_T.zc + DD_T.lift + DD_O[2] + DD_DZ[2]];
}
const ddBB = pts => [[0,1,2].map(i => Math.min(...pts.map(p => p[i]))), [0,1,2].map(i => Math.max(...pts.map(p => p[i])))];
// face normal by Newell's method (robust for rounded outlines whose first points are nearly in line)
const ddNormal = q => { let nx = 0, ny = 0, nz = 0;
  for (let i = 0; i < q.length; i++){ const a = q[i], b = q[(i+1) % q.length]; nx += (a[1]-b[1])*(a[2]+b[2]); ny += (a[2]-b[2])*(a[0]+b[0]); nz += (a[0]-b[0])*(a[1]+b[1]); }
  return norm([nx, ny, nz]); };

/* ---------- solids (local coords in, {svg, pts} out, pts in world coords) ---------- */
function ddSolid(faces, m, w = .8, sil = 1.2){
  const F = faces.map(q => q.map(ddXF)), all = F.flat(), c = avg(all);
  let s = '';
  for (const q of F){ let n = ddNormal(q); if (dot(n, sub(avg(q), c)) < 0) n = n.map(v => -v); if (vis(n)) s += shape(q, toneI(n, m), w); }
  return { svg: s + (sil ? hullInk(all, sil) : ''), pts: all };
}
function ddPrism(poly, z0, z1, m, w = .8, sil = 1.2){
  const n = poly.length, faces = [poly.map(([x, y]) => [x, y, z0]), poly.map(([x, y]) => [x, y, z1])];
  for (let i = 0; i < n; i++){ const a = poly[i], b = poly[(i+1) % n]; faces.push([[a[0], a[1], z0], [b[0], b[1], z0], [b[0], b[1], z1], [a[0], a[1], z1]]); }
  return ddSolid(faces, m, w, sil);
}
const ddBox = (x0, y0, z0, x1, y1, z1, m, w = .8, sil = 1.1) => ddPrism([[x0, y0], [x1, y0], [x1, y1], [x0, y1]], z0, z1, m, w, sil);
function ddRod(a, b, r, m, w = .9, r1 = r, n = 14){
  const A = ddXF(a), B = ddXF(b), e = Math.max(r, r1);
  return { svg: rod(A, B, r, m, toneI, w, r1, n), pts: [A, B, ...[[e,0,0],[-e,0,0],[0,e,0],[0,-e,0],[0,0,e],[0,0,-e]].flatMap(d => [A.map((v, i) => v + d[i]), B.map((v, i) => v + d[i])])] };
}
const ddCyl = (x, y, z0, z1, r, m, w = .9, n = 16) => ddRod([x, y, z0], [x, y, z1], r, m, w, r, n);
// a body swept along x between two (y, z) outlines (rounded shells, noses); ends capped
function ddSweep(prof0, x0, prof1, x1, m, w = 1.4){
  const A = prof0.map(([y, z]) => ddXF([x0, y, z])), B = prof1.map(([y, z]) => ddXF([x1, y, z]));
  let s = loft(A, B, nr => tone(nr, m));
  const ax = norm(sub(avg(B), avg(A)));
  for (const [R, d] of [[A, ax.map(v => -v)], [B, ax]]) if (vis(d)) s += shape(R, tone(d, m), 1);
  return { svg: s + hullInk([...A, ...B], w), pts: [...A, ...B] };
}
// a dome (canopy) on a ring: radius r, height h, centred (x, y) at z0
function ddDome(x, y, z0, r, h, m){
  const rings = [0, .35, .65, .88, 1].map(t => { const a = t*Math.PI/2; return ellUV(x, y, r*Math.cos(a) + .01, r*Math.cos(a) + .01, 20).map(([u, v]) => ddXF([u, v, z0 + h*Math.sin(a)])); });
  let s = ''; for (let i = 0; i < rings.length - 1; i++) s += loft(rings[i], rings[i+1], nr => tone(nr, m));
  return { svg: s + hullInk(rings.flat(), 1.6), pts: rings.flat() };
}
// a ball: two domes back to back (the sensor turret under a nose)
const ddBall = (x, y, z, r, m) => { const u = ddDome(x, y, z, r, r, m), d = ddDome(x, y, z, r, -r, m);
  return { svg: u.svg + d.svg, pts: [...u.pts, ...d.pts] }; };
// a slab between two copies of an [x, z] outline, extruded from y0 to y1 (fins, gear plates, flat brackets)
function ddSlab(poly, y0, y1, m, w = .9){
  const A = poly.map(([x, z]) => [x, y0, z]), B = poly.map(([x, z]) => [x, y1, z]), faces = [A, B];
  for (let i = 0; i < poly.length; i++){ const j = (i + 1) % poly.length;
    faces.push([[poly[i][0], y0, poly[i][1]], [poly[j][0], y0, poly[j][1]], [poly[j][0], y1, poly[j][1]], [poly[i][0], y1, poly[i][1]]]); }
  return ddSolid(faces, m, w, 1.2);
}
// a wire: an inked coloured line through local points
function ddWire(pts, col, w = .9){
  const W = pts.map(ddXF), d = pd(W, false);
  return { svg: `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(w*2 + .9)}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(w*2)}" stroke-linejoin="round" stroke-linecap="round"/>`, pts: W };
}
const dd2Rect = (x0, y0, x1, y1, r = 0) => r > 0 ? rrUV(x0, y0, x1, y1, r, 4) : rectUV(x0, y0, x1, y1);
// an octagonal section: a box with its corners cut, which is what makes a moulded shell read as faceted
const dd2Oct = (h, z0, z1, c) => [[-h + c, z0], [h - c, z0], [h, z0 + c], [h, z1 - c], [h - c, z1], [-h + c, z1], [-h, z1 - c], [-h, z0 + c]];
// a rectangle of length len, width w, centred at (cx, cy), turned to angle a (deg)
const dd2Rot = (cx, cy, a, len, w) => { const c = Math.cos(a*Math.PI/180), s = Math.sin(a*Math.PI/180);
  return [[-len/2, -w/2], [len/2, -w/2], [len/2, w/2], [-len/2, w/2]].map(([u, v]) => [cx + u*c - v*s, cy + u*s + v*c]); };
// an arm: from radius r0 to the motor at r1 along angle a, with a round motor pad
const dd2Arm = (a, r0, r1, w, pad) => { const c = Math.cos(a*Math.PI/180), s = Math.sin(a*Math.PI/180), mx = r1*c, my = r1*s;
  return hull([[r0*c + w/2*s, r0*s - w/2*c], [r0*c - w/2*s, r0*s + w/2*c], ...ellUV(mx, my, pad, pad, 16)]); };

/* ---------- propeller, spin arrow, thrust arrow ---------- */
function ddProp(mx, my, zP, R, blades, dir, col, ang, speed, chord = 1){
  const M = matOf(col), hubR = Math.max(R*.09, 2.2);
  let s = '';
  const pts = [];
  // spinning fast: a pale disc with faint blades; slow or still: solid twisted blades
  const blur = Math.min(1, speed*1.6);
  if (blur > .05){ const ring = ellUV(mx, my, R, R, 28).map(([u, v]) => ddXF([u, v, zP + 1.2]));
    s += fill(pd(ring), col, `opacity="${f(.28*blur)}"`) + `<path d="${pd(ring)}" fill="none" stroke="${INK}" stroke-width=".6" opacity="${f(.5*blur)}" stroke-dasharray="3 3"/>`; }
  for (let b = 0; b < blades; b++){
    const th = ang*Math.PI/180*-dir + b*2*Math.PI/blades, r0 = hubR*.8;
    const wr = R*.17*chord, wt = R*.08*chord, lead = -dir;   // leading edge moves the way the prop turns, and sits higher (pitch)
    const P2 = (r, w, z) => { const a = th + lead*w/r; return [mx + r*Math.cos(a), my + r*Math.sin(a), z]; };
    const q = [P2(r0, wr*.5, zP + 2.4), P2(R*.55, wr, zP + 2.2), P2(R, wt, zP + 1.6), P2(R, -wt*.6, zP + .9), P2(R*.55, -wr*.6, zP + .6), P2(r0, -wr*.4, zP + .5)].map(ddXF);
    let n = ddNormal(q); if (!vis(n)) n = n.map(v => -v);
    s += `<g opacity="${f(1 - .75*blur)}">` + shape(q, toneI(n, M), .8) + '</g>'; pts.push(...q);
  }
  const hub = ddCyl(mx, my, zP, zP + 3.2, hubR, M, .8, 12);
  return { svg: s + hub.svg, pts: [...pts, ...hub.pts, ...ellUV(mx, my, R, R, 8).map(([u, v]) => ddXF([u, v, zP + 1]))] };
}
function ddSpinArrow(mx, my, z, R, dir){
  const col = dir > 0 ? DD_CW : DD_CCW, a0 = dir > 0 ? 160 : 20, sweep = -dir*130, r = R*.62, n = 14;
  const arc = Array.from({ length:n+1 }, (_, i) => { const a = (a0 + sweep*i/n)*Math.PI/180; return [mx + r*Math.cos(a), my + r*Math.sin(a), z]; });
  const ae = (a0 + sweep)*Math.PI/180, tdir = [-Math.sin(ae)*-dir, Math.cos(ae)*-dir], hl = R*.2, hw = R*.11;
  const end = arc[n], tip = [end[0] + tdir[0]*hl, end[1] + tdir[1]*hl, z], rad = [Math.cos(ae), Math.sin(ae)];
  const head = [tip, [end[0] + rad[0]*hw, end[1] + rad[1]*hw, z], [end[0] - rad[0]*hw, end[1] - rad[1]*hw, z]].map(ddXF);
  const W = arc.map(ddXF), d = pd(W, false);
  return { svg: `<path d="${d}" fill="none" stroke="${INK}" stroke-width="3.6" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/>` + shape(head, col, 1.1), pts: [...W, ...head] };
}
function ddThrust(mx, my, z, R, k){
  const len = R*1.15*k, r = Math.max(1.4, R*.045);
  const shaft = ddRod([mx, my, z], [mx, my, z + len], r, matOf('#f4b829'), .9), head = ddRod([mx, my, z + len], [mx, my, z + len + r*5], r*2.6, matOf('#f4b829'), 1, 0);
  return { svg: shaft.svg + head.svg, pts: [...shaft.pts, ...head.pts] };
}

/* ---------- the model: every part as a byDepth item tagged with its build step and kind ---------- */
const DD_STEP_I = Object.fromEntries(DL_STEPS.map((s, i) => [s.k, i]));
/* opt: { show(i) -> 0 (hidden) | 0..1 (placing) | 1, drop: dz for a part being placed, spin, speeds[], thrust[], arrows, sel }
   returns { items, labels:{key: point}, shadow: points, top } */
function ddModel(D, opt){
  const g = D.geo, items = [], labels = {}, shadow = [];
  let cur = null;
  const step = k => { const i = DD_STEP_I[k], v = opt.show(i); cur = v > 0 ? { i, v } : null;
    const k2 = v > 0 && v < 1 ? 1 - ease(v) : 0, from = opt.from && opt.from[k] || [0, 0, 1];
    DD_DZ = from.map(c => c*k2*opt.drop); return !!cur; };
  const add = (key, sol, flags = {}) => { if (!cur) return; const box3 = ddBB(sol.pts);
    let svg = sol.svg; if (cur.v < 1) svg = `<g opacity="${f(Math.min(1, cur.v*2))}">${svg}</g>`;
    const nm = (D.partText && D.partText[key]) || DL_PARTS[key] || [key.toUpperCase(), ''];
    svg = `<g data-act="part" data-k="${key}" class="pt${opt.sel === key ? ' selp' : ''}"><title>${nm[0]}: ${nm[1]}</title>${svg}</g>`;
    items.push({ box: box3, svg, key, step: cur.i, cover: !!flags.cover, inner: !!flags.inner });
    if (!labels[key] && cur.v >= 1) labels[key] = flags.at ? ddXF(flags.at) : boxMid(box3); };
  const motors = g.motors.map((m, i) => ({ ...m, ...(g.pos ? { x: g.pos[i][0], y: g.pos[i][1] } : { x: g.arm*Math.cos(m.a*Math.PI/180), y: g.arm*Math.sin(m.a*Math.PI/180) }) }));
  // spin / speed / arrows are handed to the style too: a helicopter draws its tail rotor, so it needs the same phase
  const st = { motors, zP: 0, zMotor: 0, top: 0, spin: opt.spin || 0, speed: (opt.speeds && opt.speeds[0]) || 0, arrows: !!opt.arrows };
  const B = { xplate: ddXPlate, duct: ddDuct, shell: ddShell, round: ddRound, strike: ddStrike, bolt: ddBolt, heli: ddHeli }[g.style];
  B(D, g, st, step, add, shadow);
  // motors, props, arrows and thrust are the same on every drone (each style sets st.zMotor, st.zP and motor sizes)
  const mm = matOf(D.geo.motorCol || '#c9cfd2'), bell = g.bellCol ? matOf(g.bellCol) : PALS[D.pal] ? PALS[D.pal] : DD_SILVER;
  if (step('motors')) motors.forEach((m, i) => {
    const z0 = m.z0 != null ? m.z0 : st.zMotor, R = g.motorR, h = g.motorH || R*1.2;
    const base = ddCyl(m.x, m.y, z0, z0 + R*.22, R*.86, DD_CHIP, .8, 16), bel = ddCyl(m.x, m.y, z0 + R*.22, z0 + R*.22 + h, R, bell, 1, 18);
    const shaft = ddCyl(m.x, m.y, z0 + R*.22 + h, (m.zP != null ? m.zP : st.zP) + 3, Math.max(1, R*.13), DD_SILVER, .7, 10);
    add('motor', { svg: base.svg + bel.svg + shaft.svg, pts: [...base.pts, ...bel.pts, ...shaft.pts] }, { at: [m.x, m.y, z0 + h] });
    shadow.push(ddXF([m.x, m.y, z0 + h]));
  });
  if (opt.arrows && opt.show(DD_STEP_I.motors) >= 1) motors.forEach(m => {
    const zP = m.zP != null ? m.zP : st.zP; DD_DZ = [0, 0, 0];
    // a rotor with a huge disc draws its arrow close in: a full-size arc reads as a stray cable, not a spin cue
    const aR = m.arrowR || g.propR;
    const a = ddSpinArrow(m.x, m.y, zP + aR*.14 + 4, aR, m.dir);
    items.push({ box: ddBB(a.pts), svg: `<g class="spin">${a.svg}</g>`, key: 'arrow', step: -1 }); });
  if (step('props')) motors.forEach((m, i) => {
    if (m.noProp) return;   // a style that draws its own blades (a helicopter's rotor) opts out here
    const zP = m.zP != null ? m.zP : st.zP, sp = (opt.speeds && opt.speeds[i]) || 0;
    add('prop', ddProp(m.x, m.y, zP, g.propR, g.blades, m.dir, g.propCol, (opt.spin || 0)*(.6 + .4*sp) + i*37, sp), { at: [m.x + g.propR*.7, m.y, zP + 2] });
  });
  if (opt.thrust) motors.forEach((m, i) => { DD_DZ = [0, 0, 0];
    const zP = m.zP != null ? m.zP : st.zP, tR = m.thrustR || g.propR, t = ddThrust(m.x, m.y, zP + 5, tR, opt.thrust[i]);
    items.push({ box: ddBB(t.pts), svg: t.svg, key: 'thrust', step: -1 }); });
  DD_DZ = [0, 0, 0];
  return { items, labels, shadow, top: st.top, motors, zP: st.zP };
}

/* ---------- style: carbon X frame (5" freestyle, racer, 7" long range) ---------- */
function ddXPlate(D, g, st, step, add, shadow){
  const L = g.plateL, W = g.plateW, pal = PALS[D.pal];
  const zB = 2.5, zA = 5, zA1 = 10, zC = 12, T0 = zC + g.standH, R = g.motorR;
  st.zMotor = zA1; st.zP = zA1 + R*.22 + g.motorH + 1.2; st.top = T0;
  const corners = [[L/2 - 9, W/2 - 6], [L/2 - 9, -W/2 + 6], [-L/2 + 9, W/2 - 6], [-L/2 + 9, -W/2 + 6]];
  if (step('frame')){
    add('plate', ddPrism(dd2Rect(-L/2, -W/2, L/2, W/2, 8), zB, zA, DD_CARBON, .9, 1.4), { at: [-L/2 + 6, W/2 - 4, zA] });
    for (const [x, y] of corners) add('foot', ddCyl(x, y, 0, zB, 4, DD_RUBBER, .7, 10));
    // camera side plates (the cage the FPV camera sits in)
    for (const y of [-12.5, 11]) add('plate', ddBox(L/2 - 24, y, zC, L/2 + 1, y + 1.5, T0, DD_CARBON, .8, 1));
  }
  if (step('arms')){
    g.motors.forEach(m => add('arm', ddPrism(dd2Arm(m.a, 18, g.arm, g.armW, R*.95), zA, zA1, DD_CARBON, .9, 1.3), { at: [g.arm*.6*Math.cos(m.a*Math.PI/180), g.arm*.6*Math.sin(m.a*Math.PI/180), zA1] }));
    add('plate', ddPrism(dd2Rect(-L/2 + 4, -W/2 + 2, L/2 - 22, W/2 - 2, 6), zA1, zC, DD_CARBON, .8, 1.1));
    for (const m of g.motors) shadow.push(ddXF([g.arm*Math.cos(m.a*Math.PI/180), g.arm*Math.sin(m.a*Math.PI/180), zA1]));
  }
  const s2 = g.stack/2, bw = s2 + 3, zE = zC + 4, zF = zE + 10;
  if (step('esc')){
    for (const sx of [-s2, s2]) for (const sy of [-s2, s2]) add('standoff', ddCyl(sx - 4, sy, zC, zF + 2, 1.5, DD_GREY, .6, 8));
    const esc = ddBox(-bw - 4, -bw, zE, bw - 4, bw, zE + 1.6, DD_PCB_E, .8, 1);
    let svg = esc.svg; for (let i = 0; i < 4; i++) for (const sy of [-9, 5]) svg += ddBox(-14 - 4 + i*7, sy, zE + 1.6, -10 - 4 + i*7, sy + 4, zE + 3, DD_CHIP, .5, .6).svg;
    add('esc', { svg, pts: esc.pts }, { inner: true, at: [bw - 4, bw, zE + 1] });
  }
  if (step('fc')){
    const fc = ddBox(-bw - 4, -bw, zF, bw - 4, bw, zF + 1.6, DD_PCB_F, .8, 1);
    const mcu = ddBox(-9, -6, zF + 1.6, 3, 6, zF + 3, DD_CHIP, .5, .6), usb = ddBox(-8, bw - 1, zF + 1.6, 0, bw + 1.5, zF + 4.6, DD_SILVER, .5, .6);
    add('fc', { svg: fc.svg + mcu.svg + usb.svg, pts: fc.pts }, { inner: true, at: [-bw - 4, -bw, zF + 1] });
    add('gyro', ddBox(6, -bw + 4, zF + 1.6, 10, -bw + 8, zF + 2.8, matOf('#d8d8d8'), .5, .6), { inner: true });
  }
  const zV = zF + 3.6, rear = -L/2;
  if (step('camera')){
    const cam = ddBox(L/2 - 21, -9.5, zC + 5, L/2 - 2, 9.5, zC + 24, DD_CHIP, .8, 1.1);
    const tilt = 25*Math.PI/180, lc = [L/2 - 2, 0, zC + 14.5], lens = ddRod(lc, [lc[0] + 9*Math.cos(tilt), 0, lc[2] + 9*Math.sin(tilt)], 7, DD_CHIP, .9, 6.4);
    const glass = ddRod([lc[0] + 9*Math.cos(tilt), 0, lc[2] + 9*Math.sin(tilt)], [lc[0] + 9.6*Math.cos(tilt), 0, lc[2] + 9.6*Math.sin(tilt)], 4.6, matOf('#4b6b9a'), .6);
    add('camera', { svg: cam.svg + lens.svg + glass.svg, pts: [...cam.pts, ...lens.pts] });
    add('vtx', ddBox(-14 - 4, -13, zV, 14 - 4, 13, zV + 4, matOf('#3a3f45'), .8, 1), { inner: true });
    add('rx', ddBox(rear + 6, -5, zC, rear + 18, 5, zC + 2, DD_PCB_E, .6, .8), { inner: true });
    for (const s of [-1, 1]) add('antenna', ddRod([rear + 6, 3*s, zC + 1], [rear - 22, 16*s, zC + 10], 1, DD_WHITE, .7), { at: [rear - 20, 15*s, zC + 9] });
    add('antenna', ddRod([rear - 2, 0, zV + 2], [rear - 20, 0, T0 + 20], 2.6, DD_CHIP, .8), { at: [rear - 18, 0, T0 + 18] });
  }
  if (step('wiring')){
    const cols = ['#e2483d', '#f4b829', '#3f78d8'];
    g.motors.forEach(m => { const c = Math.cos(m.a*Math.PI/180), s = Math.sin(m.a*Math.PI/180);
      cols.forEach((col, k) => { const o = (k - 1)*2.4, ox = -s*o, oy = c*o, rr = g.arm - R - 2;
        add('wire', ddWire([[rr*c + ox, rr*s + oy, zA1 + .8], [(rr*.5 + 12)*c + ox, (rr*.5 + 12)*s + oy, zA1 + .8]], col, .7), { inner: true });
        add('wire', ddWire([[(rr*.5 + 12)*c + ox, (rr*.5 + 12)*s + oy, zA1 + .8], [24*c + ox, 24*s + oy, zC + .8], [(bw - 2)*c - 4 + ox, (bw - 2)*s + oy, zE + 1.8]], col, .7), { inner: true }); }); });
    for (const [s, col] of [[3, '#e2483d'], [-3, '#3a3632']]) add('xt60', ddWire([[-bw - 2, s, zE + 1.8], [rear + 2, s, zE + 1], [rear - 6, s, zE + 4], [rear - 10, s, T0 - 2]], col, 1.5), { inner: true });
    add('xt60', ddBox(rear - 16, -6, T0 - 4, rear - 4, 6, T0 + 4, matOf('#f4c430'), .8, 1));
    add('cap', ddRod([rear + 4, 8, zC + 5], [rear - 16, 8, zC + 5], 4.5, matOf('#3b4a6b'), .8), { inner: true });
    add('wire', ddWire([[L/2 - 21, 0, zC + 10], [bw - 2, 0, zF + 2]], '#8a8a8a', .5), { inner: true });
  }
  if (step('shell')){

    if (g.action){

      const ac = ddBox(L/2 - 32, -35, T0 + 8, L/2 - 4, 35, T0 + 54, DD_CHIP, .9, 1.4), lens = ddRod([L/2 - 4, 18, T0 + 34], [L/2 + 4, 18, T0 + 34], 10, DD_CHIP, 1);

    const b = ddBox(x0, -bw2/2, z0, x1, bw2/2, z0 + bh, matOf('#3f9fd8'), 1, 1.8);
    let svg = b.svg;
    if (!DD_T.r && !DD_T.p && !DD_T.y){ const sy = vis([0, 1, 0]) ? bw2/2 + .3 : -bw2/2 - .3;
      svg += vis([0, sy > 0 ? 1 : -1, 0]) ? ddLabelY((x0 + x1)/2, sy, z0 + bh/2 - 3, g.cells, 9) : ''; }
    add('battery', { svg, pts: b.pts }, { cover: true, at: [x0 + 6, bw2/2, z0 + bh*.7] });
    const sx = (x0 + x1)/2;
    add('strap', ddPrism(dd2Rect(sx - 7, -bw2/2 - 1.2, sx + 7, bw2/2 + 1.2), z0 + bh, z0 + bh + 1.4, pal || matOf('#e2483d'), .7, .9), { cover: true });
    for (const s of [-1, 1]) add('strap', ddBox(sx - 7, s > 0 ? bw2/2 : -bw2/2 - 1.2, z0, sx + 7, s > 0 ? bw2/2 + 1.2 : -bw2/2, z0 + bh + 1.4, pal || matOf('#e2483d'), .7, .9), { cover: true });
    add('xt60', ddWire([[x0 + 2, 4, z0 + bh*.4], [rear - 10, 4, T0 + 4]], '#e2483d', 1.4));
    shadow.push(ddXF([x0, -bw2/2, z0 + bh]), ddXF([x1, bw2/2, z0 + bh]));
  }
}
// text on a y = const face, reading correctly from whichever side faces the viewer
function ddLabelY(x, y, z, str, size){
  const o = P(...ddXF([x, y, z])), U = Dv(y > 0 ? -1 : 1, 0, 0), V = Dv(0, 0, -1);
  return `<text transform="${txM(o, U, V)}" font-size="${size}" fill="#fff4d6" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">${str}</text>`;

/* ---------- style: ducted (cinewhoop, tiny whoop) ---------- */
function ddDuct(D, g, st, step, add, shadow){
  const wh = !!g.whoop, pal = PALS[D.pal], zp0 = wh ? 7 : 3, zp1 = zp0 + (wh ? 1.5 : 2.5), R = g.motorR;
  st.zMotor = zp1; st.zP = zp1 + R*.22 + g.motorH + 1;
  const dH = Math.max(g.ductH, st.zP + 4), dR = g.ductR, thick = wh ? 1.2 : 2.5;
  const L = wh ? 30 : 64, W = wh ? 22 : 40;
  st.top = dH;
  const ducts = () => g.motors.forEach(m => { const mx = g.arm*Math.cos(m.a*Math.PI/180), my = g.arm*Math.sin(m.a*Math.PI/180), n = 16;
    for (let i = 0; i < n; i++){ const a0 = i/n*2*Math.PI, a1 = (i + 1)/n*2*Math.PI, pt = (r, a) => [mx + r*Math.cos(a), my + r*Math.sin(a)];
      add('duct', ddPrism([pt(dR, a0), pt(dR + thick, a0), pt(dR + thick, a1), pt(dR, a1)], 0, dH, pal, .5, 0), { at: [mx + (dR + thick)*Math.cos(m.a*Math.PI/180), my + (dR + thick)*Math.sin(m.a*Math.PI/180), dH] }); }
    // the duct's rim ink, top and bottom, in short pieces so they sort with the ring
    for (let i = 0; i < n; i++){ const a0 = i/n*2*Math.PI, a1 = (i + 1)/n*2*Math.PI, ring = [];
      for (const r of [dR, dR + thick]) for (const z of [0, dH]) ring.push([[mx + r*Math.cos(a0), my + r*Math.sin(a0), z], [mx + r*Math.cos(a1), my + r*Math.sin(a1), z]]);
      const W2 = ring.map(seg => seg.map(ddXF)), hidden = !vis([Math.cos((a0 + a1)/2), Math.sin((a0 + a1)/2), 0]);
      add('duct', { svg: W2.map(s2 => ink(pd(s2, false), 1.5)).join('') + (hidden ? '' : ink(pd([W2[2][0], W2[3][0]], false), .4)), pts: W2.flat() }); }
    shadow.push(...ellUV(mx, my, dR + thick, dR + thick, 10).map(([u, v]) => ddXF([u, v, dH]))); });
  if (step('frame')){
    add('plate', ddPrism(dd2Rect(-L/2, -W/2, L/2, W/2, wh ? 4 : 8), zp0, zp1, wh ? pal : DD_CARBON, .9, 1.3), { at: [-L/2 + 4, W/2 - 3, zp1] });
    g.motors.forEach(m => { add('arm', ddPrism(dd2Arm(m.a, wh ? 8 : 16, g.arm, g.armW, R*1.25), zp0, zp1, wh ? pal : DD_CARBON, .8, 1.1));
      const mx = g.arm*Math.cos(m.a*Math.PI/180), my = g.arm*Math.sin(m.a*Math.PI/180);
      for (const da of [70, -70]) { const a = m.a + 180 + da, poly = dd2Arm(a, 0, dR + thick/2, wh ? 2 : 4, 0).map(([u, v]) => [u + mx, v + my]);
        add('arm', ddPrism(hull(poly), zp0, zp1, wh ? pal : DD_CARBON, .6, .8)); } });
    if (wh) ducts();
  }
  if (!wh && step('arms')) ducts();
  const s2 = g.stack/2, zE = zp1 + 3.5, zF = zE + 7;
  if (!wh && step('esc')){
    for (const sx of [-s2, s2]) for (const sy of [-s2, s2]) add('standoff', ddCyl(sx, sy, zp1, zF + 2, 1.2, DD_GREY, .6, 8));

    if (!wh) add('vtx', ddBox(-L/2 + 8, -15, zF + 2.5, 10, 15, zF + 10, matOf('#d9d6cc'), .8, 1), { inner: true });
    for (const s of wh ? [0] : [-1, 1]) add('antenna', ddRod([-L/2 + 4, 6*s, zp1 + 6], [-L/2 - (wh ? 14 : 22), 12*s, zp1 + (wh ? 10 : 22)], wh ? .5 : 1.4, DD_WHITE, .7));
  }
  if (step('wiring')){
    g.motors.forEach(m => { const c = Math.cos(m.a*Math.PI/180), s = Math.sin(m.a*Math.PI/180), r0 = g.arm - R - 1, r1 = wh ? 10 : s2 + 2;
      add('wire', ddWire([[r0*c, r0*s, zp1 + .6], [r1*c, r1*s, zp1 + .6], [r1*c, r1*s, (wh ? zp1 + 2 : zE + 1.6)]], wh ? '#e2483d' : '#f4b829', wh ? .4 : .7), { inner: true }); });
    for (const [s, col] of [[2, '#e2483d'], [-2, '#3a3632']]) add('xt60', ddWire([[-s2 - 2, s, zE + 1], [-L/2 - 4, s, zp1 + 2], [-L/2 - 8, s, zp1 + 10]], col, wh ? .5 : 1.1), { inner: true });

  }
  if (step('shell')){

    if (!wh && !DD_T.r && !DD_T.p && !DD_T.y){ const sy = vis([0, 1, 0]) ? bw2/2 + .3 : -bw2/2 - .3; svg += ddLabelY(-4, sy, z0 + bh/2 - 3, g.cells, 8); }
    add('battery', { svg, pts: b.pts }, { cover: !wh, at: [bl/2 - 6, bw2/2, z0 + bh*.6] });

  }
}

/* ---------- style: folding camera drone with a moulded shell (Mini) ---------- */

      const pod = [m.x, m.y, front ? m.z0 - 4 : m.z0 - 4];
      add('arm', ddRod(hinge, pod, 5, light, 1), { at: [(hinge[0] + pod[0])/2, (hinge[1] + pod[1])/2, (hinge[2] + pod[2])/2 + 5] });
      add('arm', ddCyl(m.x, m.y, front ? m.z0 - 14 : 0, m.z0, g.motorR + 1.5, light, 1, 16));
      if (front) add('foot', ddRod([m.x, m.y, m.z0 - 14], [m.x, m.y, 0], 2.5, light, .8));
      add('arm', ddCyl(hinge[0], hinge[1], hinge[2] - 5, hinge[2] + 5, 5.5, matOf('#c9c4b6'), .8, 12)); });
  }
  if (step('esc')) add('esc', ddBox(-6, -22, 13, 44, 22, 14.6, DD_PCB_E, .8, 1), { inner: true });
  if (step('fc')){
    const b = ddBox(-4, -24, 26, 52, 24, 27.6, DD_PCB_F, .8, 1), soc = ddBox(14, -9, 27.6, 30, 9, 29.4, DD_CHIP, .5, .6);
    add('fc', { svg: b.svg + soc.svg, pts: b.pts }, { inner: true, at: [52, 24, 27] });
    add('gyro', ddBox(36, -4, 27.6, 40, 0, 28.8, matOf('#d8d8d8'), .5, .6), { inner: true });
  }
  if (step('camera')){
    const br = ddBox(XN - 6, -6, 12, XN + 2, 6, 22, matOf('#c9c4b6'), .8, 1), roll = ddRod([XN + 2, 0, 17], [XN + 8, 0, 17], 7, DD_CHIP, .9);
    add('gimbal', { svg: br.svg + roll.svg, pts: [...br.pts, ...roll.pts] }, { at: [XN + 6, 7, 17] });
    add('gimbal', ddBox(XN + 8, -17, 6, XN + 12, -13, 24, DD_CHIP, .8, 1));
    add('gimbal', ddRod([XN + 16, -19, 15], [XN + 16, -13, 15], 6, DD_CHIP, .9));
    const head = ddBox(XN + 12, -12, 5, XN + 30, 12, 25, DD_CHIP, .9, 1.3), lens = ddRod([XN + 30, 0, 15], [XN + 34, 0, 15], 7, DD_CHIP, .9), gl = ddRod([XN + 34, 0, 15], [XN + 34.6, 0, 15], 4.8, matOf('#4b6b9a'), .6);
    add('camera', { svg: head.svg + lens.svg + gl.svg, pts: [...head.pts, ...lens.pts] });
    add('gps', ddBox(-60, -13, 46, -34, 13, 50, matOf('#c9a45a'), .7, .9), { inner: true });
    for (const s of [-1, 1]) add('antenna', ddRod([88, 104*s, 24], [88, 104*s, 6], 1.2, matOf('#7a7a7a'), .6), { inner: true });
  }
  if (step('wiring')){
    st.motors.forEach(m => { const front = m.x > 0, s = Math.sign(m.y);
      add('wire', ddWire([[front ? 30 : -10, 20*s, front ? 27 : 14], [front ? X1 - 8 : X0 + 8, 27*s, front ? 30 : 16], [m.x, m.y, m.z0 - 2]], '#d9a640', .6), { inner: true }); });
    add('wire', ddWire([[48, 0, 27], [XN - 4, 0, 20], [XN + 4, 0, 17]], '#d9a640', 1), { inner: true });
  }
  if (step('shell')){

    add('battery', { svg, pts: b.pts }, { inner: true, at: [X0, 20, 28] });

/* ---------- style: strike quad (tall legs, payload pod slung under the belly) ---------- */
const ddStrikeLayout = g => DL_STRIKE(g);
function ddStrike(D, g, st, step, add, shadow){
  const L = g.plateL, W = g.plateW, pal = PALS[D.pal], R = g.motorR;
  const { zB, zA, zA1, zC, zE, zF, T0, s2, bw, pod: P } = ddStrikeLayout(g);
  st.zMotor = zA1; st.zP = zA1 + R*.22 + g.motorH + 1.2; st.top = T0 + g.batt[2];
  const corners = [[L/2 - 14, W/2 - 9], [L/2 - 14, -W/2 + 9], [-L/2 + 14, W/2 - 9], [-L/2 + 14, -W/2 + 9]];
  if (step('frame')){
    add('plate', ddPrism(dd2Rect(-L/2, -W/2, L/2, W/2, 10), zB, zA, DD_CARBON, .9, 1.4), { at: [-L/2 + 8, W/2 - 6, zA] });
    // long splayed legs: the payload pod needs clear air under the belly
    for (const [x, y] of corners){
      add('gear', ddRod([x, y, zB], [x*1.1, y*1.22, 3], 4.5, DD_CARBON, 1), { at: [x*1.05, y*1.11, zB*.5] });
      add('foot', ddCyl(x*1.1, y*1.22, 0, 3, 7, DD_RUBBER, .8, 10));
      shadow.push(ddXF([x*1.1, y*1.22, 0]));
    }
    for (const y of [-13, 12]) add('plate', ddBox(L/2 - 24, y, zC, L/2 + 1, y + 1.5, T0, DD_CARBON, .8, 1));
  }
  if (step('arms')){
    g.motors.forEach(m => add('arm', ddPrism(dd2Arm(m.a, 18, g.arm, g.armW, R*.95), zA, zA1, DD_CARBON, .9, 1.3),
      { at: [g.arm*.6*Math.cos(m.a*Math.PI/180), g.arm*.6*Math.sin(m.a*Math.PI/180), zA1] }));
    add('plate', ddPrism(dd2Rect(-L/2 + 4, -W/2 + 2, L/2 - 22, W/2 - 2, 6), zA1, zC, DD_CARBON, .8, 1.1));
    for (const m of g.motors) shadow.push(ddXF([g.arm*Math.cos(m.a*Math.PI/180), g.arm*Math.sin(m.a*Math.PI/180), zA1]));
  }
  if (step('esc')){
    for (const sx of [-s2, s2]) for (const sy of [-s2, s2]) add('standoff', ddCyl(sx - 4, sy, zC, zF + 2, 1.6, DD_GREY, .6, 8));
    const esc = ddBox(-bw - 4, -bw, zE, bw - 4, bw, zE + 1.6, DD_PCB_E, .8, 1);
    let svg = esc.svg; for (let i = 0; i < 4; i++) for (const sy of [-9, 5]) svg += ddBox(-14 - 4 + i*7, sy, zE + 1.6, -10 - 4 + i*7, sy + 4, zE + 3, DD_CHIP, .5, .6).svg;
    add('esc', { svg, pts: esc.pts }, { inner: true, at: [bw - 4, bw, zE + 1] });
  }
  if (step('fc')){
    const fc = ddBox(-bw - 4, -bw, zF, bw - 4, bw, zF + 1.6, DD_PCB_F, .8, 1);
    const mcu = ddBox(-9, -6, zF + 1.6, 3, 6, zF + 3, DD_CHIP, .5, .6), usb = ddBox(-8, bw - 1, zF + 1.6, 0, bw + 1.5, zF + 4.6, DD_SILVER, .5, .6);
    add('fc', { svg: fc.svg + mcu.svg + usb.svg, pts: fc.pts }, { inner: true, at: [-bw - 4, -bw, zF + 1] });
    add('gyro', ddBox(6, -bw + 4, zF + 1.6, 10, -bw + 8, zF + 2.8, matOf('#d8d8d8'), .5, .6), { inner: true });
  }
  const zV = zF + 3.6, rear = -L/2;
  if (step('camera')){
    const cam = ddBox(L/2 - 21, -9.5, zC + 5, L/2 - 2, 9.5, zC + 24, DD_CHIP, .8, 1.1);
    const tilt = (D.fly.uptilt || 0)*Math.PI/180, lc = [L/2 - 2, 0, zC + 14.5];
    const lens = ddRod(lc, [lc[0] + 9*Math.cos(tilt), 0, lc[2] + 9*Math.sin(tilt)], 7, DD_CHIP, .9, 6.4);
    const glass = ddRod([lc[0] + 9*Math.cos(tilt), 0, lc[2] + 9*Math.sin(tilt)], [lc[0] + 9.6*Math.cos(tilt), 0, lc[2] + 9.6*Math.sin(tilt)], 4.6, matOf('#4b6b9a'), .6);
    add('camera', { svg: cam.svg + lens.svg + glass.svg, pts: [...cam.pts, ...lens.pts] });
    add('vtx', ddBox(-14 - 4, -13, zV, 14 - 4, 13, zV + 4, matOf('#3a3f45'), .8, 1), { inner: true });
    add('rx', ddBox(rear + 6, -5, zC, rear + 18, 5, zC + 2, DD_PCB_E, .6, .8), { inner: true });
    for (const s of [-1, 1]) add('antenna', ddRod([rear + 6, 3*s, zC + 1], [rear - 22, 16*s, zC + 10], 1, DD_WHITE, .7), { at: [rear - 20, 15*s, zC + 9] });
    add('antenna', ddRod([rear - 2, 0, zV + 2], [rear - 20, 0, T0 + 20], 2.6, DD_CHIP, .8), { at: [rear - 18, 0, T0 + 18] });
  }
  if (step('wiring')){
    const cols = ['#e2483d', '#f4b829', '#3f78d8'];
    g.motors.forEach(m => { const c = Math.cos(m.a*Math.PI/180), s = Math.sin(m.a*Math.PI/180);
      cols.forEach((col, k) => { const o = (k - 1)*2.4, ox = -s*o, oy = c*o, rr = g.arm - R - 2;
        add('wire', ddWire([[rr*c + ox, rr*s + oy, zA1 + .8], [(rr*.5 + 12)*c + ox, (rr*.5 + 12)*s + oy, zA1 + .8]], col, .7), { inner: true });
        add('wire', ddWire([[(rr*.5 + 12)*c + ox, (rr*.5 + 12)*s + oy, zA1 + .8], [24*c + ox, 24*s + oy, zC + .8], [(bw - 2)*c - 4 + ox, (bw - 2)*s + oy, zE + 1.8]], col, .7), { inner: true }); }); });
    for (const [s, col] of [[3, '#e2483d'], [-3, '#3a3632']]) add('xt60', ddWire([[-bw - 2, s, zE + 1.8], [rear + 2, s, zE + 1], [rear - 6, s, zE + 4], [rear - 10, s, T0 - 2]], col, 1.5), { inner: true });
    add('xt60', ddBox(rear - 16, -6, T0 - 4, rear - 4, 6, T0 + 4, matOf('#f4c430'), .8, 1));
    add('cap', ddRod([rear + 4, 8, zC + 5], [rear - 16, 8, zC + 5], 4.5, matOf('#3b4a6b'), .8), { inner: true });
    add('wire', ddWire([[L/2 - 21, 0, zC + 10], [bw - 2, 0, zF + 2]], '#8a8a8a', .5), { inner: true });
  }
  if (step('shell')){
    for (const [x, y] of corners) add('standoff', ddCyl(x, y, zC, T0, 2.6, pal || DD_ALU, .7, 10));
    add('plate', ddPrism(dd2Rect(-L/2, -W/2, L/2, W/2, 10), T0, T0 + 2.5, DD_CARBON, .9, 1.4), { cover: true, at: [L/2 - 12, -W/2 + 5, T0 + 2.5] });
  }
  if (step('payload')){
    // the payload pod, slung under the belly on two rails
    const body = ddBox(P.x0, -P.hy, P.z0, P.x1, P.hy, P.z1, matOf('#3f4750'), .9, 1.4);
    const nose = ddSweep(rrUV(-P.hy, P.z0, P.hy, P.z1, 8), P.x1, rrUV(-5, P.z0 + 7, 5, P.z1 - 6, 3), P.x1 + P.nose, DD_SILVER, 1.2);
    add('payload', { svg: body.svg + nose.svg, pts: [...body.pts, ...nose.pts] }, { cover: true, at: [P.x0 + 14, 0, (P.z0 + P.z1)/2] });
    // tail fins: two swept wings, one up, one down
    for (const s of [-1, 1]) add('fin', ddBox(P.x0, s > 0 ? P.hy : -P.hy - 3, P.z0 + 3, P.x0 + 18, s > 0 ? P.hy + 3 : -P.hy, P.z0 + 31, matOf('#c94f3d'), .7, .9));
    add('fin', ddBox(P.x0, -2.5, P.z1, P.x0 + 16, 2.5, P.z1 + 15, matOf('#c94f3d'), .7, .9));
    add('fin', ddBox(P.x0, -2.5, P.z0, P.x0 + 16, 2.5, P.z0 + 12, matOf('#c94f3d'), .7, .9));
    // the rails that hold the pod to the frame
    for (const s of [-1, 1]) add('standoff', ddRod([P.x0 + 16, s*12, P.z1], [P.x0 + 16, s*12, zB + 1], 2.2, DD_SILVER, .7), { at: [P.x0 + 16, s*12, (P.z1 + zB)/2] });
  }
  if (step('battery')){
    const [bl, bw2, bh] = g.batt, x1 = bl/2, x0 = x1 - bl, z0 = T0 + 2.5;
    const b = ddBox(x0, -bw2/2, z0, x1, bw2/2, z0 + bh, matOf('#3f9fd8'), 1, 1.8);

    if (!DD_T.r && !DD_T.p && !DD_T.y){ const sy = vis([0, 1, 0]) ? bw2/2 + .3 : -bw2/2 - .3;

    add('battery', { svg, pts: b.pts }, { cover: true, at: [x0 + 6, bw2/2, z0 + bh*.7] });
    const sx = (x0 + x1)/2;
    add('strap', ddPrism(dd2Rect(sx - 7, -bw2/2 - 1.2, sx + 7, bw2/2 + 1.2), z0 + bh, z0 + bh + 1.4, pal || matOf('#e2483d'), .7, .9), { cover: true });
    for (const s of [-1, 1]) add('strap', ddBox(sx - 7, s > 0 ? bw2/2 : -bw2/2 - 1.2, z0, sx + 7, s > 0 ? bw2/2 + 1.2 : -bw2/2, z0 + bh + 1.4, pal || matOf('#e2483d'), .7, .9), { cover: true });
    add('xt60', ddWire([[x0 + 2, 4, z0 + bh*.4], [rear - 10, 4, T0 + 4]], '#e2483d', 1.4));
    shadow.push(ddXF([x0, -bw2/2, z0 + bh]), ddXF([x1, bw2/2, z0 + bh]));
  }
